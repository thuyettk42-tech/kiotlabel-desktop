name: Release

# Dựng KiotLabel.exe (một tệp, giao diện nhúng sẵn) trên máy chủ GitHub từ chính mã nguồn công khai, kiểm tra, tạo chứng thực nguồn gốc
# rồi đưa lên GitHub Releases.
# Phát hành: git tag v3.5.4 && git push origin v3.5.4   (số nhãn phải trùng Version trong launcher/AppInfo.cs, xem docs/PHAT-HANH.md)
# Chạy thủ công (workflow_dispatch) chỉ dựng và lưu artifact, không tạo Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Node chỉ để build giao diện (không được đóng gói vào KiotLabel.exe)
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Nhãn phát hành khớp phiên bản trong mã
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path launcher/AppInfo.cs -Pattern 'Version = "([\d.]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Nhãn v$tag không khớp Version trong launcher/AppInfo.cs ($ver)" }

      - name: Đóng gói và kiểm tra
        shell: pwsh
        run: |
          node scripts/build-desktop.mjs --out "${{ runner.temp }}\kl-desktop" 2>&1 | Tee-Object -FilePath "${{ runner.temp }}\build.log"
          if ($LASTEXITCODE -ne 0) {
            # Đưa phần cuối nhật ký lên thành chú thích (annotation) để xem được nguyên nhân ngay trên trang chạy
            $tail = (Get-Content "${{ runner.temp }}\build.log" -Tail 12) -join '%0A'
            Write-Host "::error title=Đóng gói thất bại::$tail"
            exit 1
          }

      - name: Chứng thực nguồn gốc bản dựng
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}\kl-desktop\KiotLabel.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KiotLabel-exe
          path: |
            ${{ runner.temp }}\kl-desktop\KiotLabel.exe
            ${{ runner.temp }}\kl-desktop\KiotLabel.exe.sha256

      - name: Tạo Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "${{ runner.temp }}\kl-desktop"
          $sha = (Get-Content "$dir\KiotLabel.exe.sha256").Split(' ')[0]
          $notes = @(
            'KiotLabel bản offline cho Windows 10/11 64-bit: tải KiotLabel.exe rồi bấm đúp, không cần cài đặt hay giải nén. Xem docs/UNG-DUNG-OFFLINE.md.',
            '',
            "SHA-256: $sha",
            '',
            'Xác nhận nguồn gốc: gh attestation verify KiotLabel.exe --repo ${{ github.repository }}'
          ) -join "`n"
          gh release create "${{ github.ref_name }}" "$dir\KiotLabel.exe" "$dir\KiotLabel.exe.sha256" --title "KiotLabel ${{ github.ref_name }} (offline)" --notes "$notes"
