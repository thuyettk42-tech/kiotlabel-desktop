name: Release

# Dựng gói portable trên máy chủ GitHub từ chính mã nguồn công khai, kiểm tra, tạo chứng thực nguồn gốc rồi đưa lên GitHub Releases.
# Phát hành: git tag v3.5.0 && git push origin v3.5.0   (X.Y của nhãn phải trùng phiên bản giao diện, xem docs/PHAT-HANH.md)
# Chạy thủ công (workflow_dispatch) chỉ dựng và lưu artifact, không tạo Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # node.exe chính thức (chữ ký OpenJS Foundation) được đóng gói nguyên vẹn; script đóng gói kiểm tra chữ ký
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Nhãn phát hành khớp phiên bản trong mã
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path server/server.mjs -Pattern "const VERSION = '([\d.]+)'").Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Nhãn v$tag không khớp VERSION trong server.mjs ($ver)" }

      - name: Đóng gói và kiểm tra
        run: node scripts/build-desktop.mjs --out "${{ runner.temp }}\kl-desktop"

      - name: Chứng thực nguồn gốc bản dựng
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}\kl-desktop\KiotLabel-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KiotLabel-portable-win-x64
          path: |
            ${{ runner.temp }}\kl-desktop\KiotLabel-portable-win-x64.zip
            ${{ runner.temp }}\kl-desktop\KiotLabel-portable-win-x64.zip.sha256

      - name: Tạo Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "${{ runner.temp }}\kl-desktop"
          $sha = (Get-Content "$dir\KiotLabel-portable-win-x64.zip.sha256").Split(' ')[0]
          $notes = @(
            'KiotLabel bản offline (portable) cho Windows 10/11 64-bit. Giải nén đầy đủ rồi bấm KiotLabel.exe. Xem docs/UNG-DUNG-OFFLINE.md.',
            '',
            "SHA-256: $sha",
            '',
            'Xác nhận nguồn gốc: gh attestation verify KiotLabel-portable-win-x64.zip --repo ${{ github.repository }}'
          ) -join "`n"
          gh release create "${{ github.ref_name }}" "$dir\KiotLabel-portable-win-x64.zip" "$dir\KiotLabel-portable-win-x64.zip.sha256" --title "KiotLabel ${{ github.ref_name }} (offline)" --notes "$notes"
