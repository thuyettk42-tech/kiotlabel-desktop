name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Giao diện (kiểu TypeScript và test đơn vị)
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
      - name: Máy chủ Node cho macOS/Linux (kiểm tra cú pháp)
        run: node --check server/server.mjs

  exe:
    # Dựng thử KiotLabel.exe và chạy bộ kiểm tra phát hành (không phát hành gì)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Đóng gói và kiểm tra
        run: node scripts/build-desktop.mjs --out "${{ runner.temp }}\kl-desktop"
