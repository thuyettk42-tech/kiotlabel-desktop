name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Giao diện (kiểu TypeScript và test đơn vị)
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
      - name: Máy chủ cục bộ (kiểm tra cú pháp)
        run: node --check server/server.mjs
